<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Levels for Predictions</title>
  <style>
    body {
      background-color: #f5f8ff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }
    body.dark {
      background-color: #121212;
      color: #ffffff;
    }
    .dark-mode-toggle {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 20px;
      background: none;
      border: none;
      cursor: pointer;
    }
    h1 {
      margin-top: 40px;
    }
    input,
    select {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
      width: 220px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 10px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #333;
      color: white;
    }
    .output {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <button class="dark-mode-toggle" onclick="toggleDarkMode()">&#9728;</button>  <h1>Levels for Predictions</h1>  <select id="levelSelection">
    <option value="3">3 Levels</option>
    <option value="4">4 Levels</option>
    <option value="5">5 Levels</option>
    <option value="6">6 Levels</option>
    <option value="7">7 Levels</option>
    <option value="8">8 Levels</option>
  </select>  <select id="multiplier">
    <option value="2">2x</option>
    <option value="3">3x</option>
  </select>  <input type="number" step="any" id="totalSum" placeholder="Enter your total balance" />
  <br />
  <button onclick="generateLevels()">Generate Levels</button>
  <button onclick="downloadImage()">Download PNG</button>
  <button onclick="downloadPDF()">Download PDF</button>  <div class="output" id="output"></div><canvas id="canvas" style="display:none"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>  <script>
    let darkMode = false;

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
      darkMode = !darkMode;
      document.querySelector(".dark-mode-toggle").innerHTML = darkMode ? "&#9790;" : "&#9728;";
    }

    function generateLevels() {
      const levelCount = parseInt(document.getElementById("levelSelection").value);
      const multiplier = parseFloat(document.getElementById("multiplier").value);
      const totalSum = parseFloat(document.getElementById("totalSum").value);
      const output = document.getElementById("output");
      output.innerHTML = "";

      if (isNaN(totalSum) || totalSum <= 0) {
        output.innerHTML = "Please enter a valid total balance.";
        return;
      }

      // Calculate first level using geometric progression sum formula
      let firstLevel = totalSum * (multiplier - 1) / (Math.pow(multiplier, levelCount) - 1);
      let levels = [];
      let current = firstLevel;

      for (let i = 1; i <= levelCount; i++) {
        levels.push(current);
        output.innerHTML += `<p>Level ${i}: ${current.toFixed(2)}</p>`;
        current *= multiplier;
      }

      window.generatedLevels = levels; // for export
    }

    async function downloadImage() {
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const levels = window.generatedLevels || [];

      canvas.width = 600;
      canvas.height = 100 + levels.length * 30;

      // Background
      ctx.fillStyle = darkMode ? "#121212" : "#f5f8ff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Title
      ctx.fillStyle = darkMode ? "#fff" : "#000";
      ctx.font = "24px Arial";
      ctx.fillText("Levels for Prediction", 180, 40);

      // Levels
      ctx.font = "18px Arial";
      levels.forEach((lvl, i) => {
        ctx.fillText(`Level ${i + 1}: ${lvl.toFixed(2)}`, 200, 80 + i * 30);
      });

      // Watermark
      const watermark = new Image();
      watermark.src = URL.createObjectURL(await fetch("/mnt/data/file-PdPVzLSfMY8xh6n3tpPQoq").then(r => r.blob()));
      watermark.onload = () => {
        const w = 150;
        const h = 150;
        ctx.globalAlpha = 0.15;
        ctx.drawImage(watermark, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
        ctx.globalAlpha = 1;

        const link = document.createElement("a");
        link.download = "levels.png";
        link.href = canvas.toDataURL();
        link.click();
      }
    }

    async function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(22);
      doc.text("Levels for Prediction", 60, 20);

      const levels = window.generatedLevels || [];
      doc.setFontSize(14);
      levels.forEach((lvl, i) => {
        doc.text(`Level ${i + 1}: ${lvl.toFixed(2)}`, 60, 40 + i * 10);
      });

      const watermark = await fetch("/mnt/data/file-PdPVzLSfMY8xh6n3tpPQoq").then(r => r.blob());
      const reader = new FileReader();
      reader.onloadend = function () {
        doc.addImage(reader.result, "PNG", 50, 90, 100, 100, undefined, "FAST");
        doc.save("levels.pdf");
      };
      reader.readAsDataURL(watermark);
    }
  </script></body>
</html>
