<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Levels for Predictions</title>
  <style>
    :root {
      --bg-color: #f0f8ff;
      --text-color: #000;
      --button-bg: #333;
      --button-text: #fff;
      --link-color: #1e90ff;
    }

    body.dark-mode {
      --bg-color: #1e1e1e;
      --text-color: #f0f0f0;
      --button-bg: #444;
      --button-text: #fff;
      --link-color: #87cefa;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      transition: background-color 0.4s, color 0.4s;
    }

    select, input[type="number"], button {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
      width: 220px;
      max-width: 90%;
    }

    button {
      background-color: var(--button-bg);
      color: var(--button-text);
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .output {
      margin-top: 30px;
      font-size: 18px;
    }

    .sum {
      margin-top: 20px;
      font-weight: bold;
      font-size: 20px;
    }

    .theme-toggle {
      position: relative;
      margin: 0 auto 10px auto;
      display: inline-block;
      background: transparent;
      font-size: 22px;
      border: none;
      cursor: pointer;
    }

    footer {
      color: var(--text-color);
      padding: 10px;
      text-align: center;
    }

    footer a {
      color: var(--link-color);
      text-decoration: none;
      font-weight: bold;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>

  <h1>Levels for Predictions</h1>
  <p>Created by: @Mrunknown</p>

  <select id="multiplierSelection">
    <option value="3">3x</option>
    <option value="2">2x</option>
  </select>
  <br>

  <select id="levelSelection">
    <option value="8">8 Levels</option>
    <option value="7">7 Levels</option>
    <option value="6">6 Levels</option>
    <option value="5">5 Levels</option>
    <option value="4">4 Levels</option>
  </select>
  <br>

  <input type="number" step="any" id="sumInput" placeholder="Enter your total balance">
  <br>
  <button onclick="calculateFromSum()">Calculate Levels</button>
  <button onclick="clearFields()">Clear</button>
  <button onclick="downloadLevels()">Download Levels</button>

  <div class="output" id="output"></div>
  <div class="sum" id="sum"></div>

  <footer>
    <p>Connect with us on <a href="https://t.me/Unknown_rizz" target="_blank">Telegram</a></p>
  </footer>

  <script>
    let lastLevels = [];

    function calculateFromSum() {
      const multiplier = parseFloat(document.getElementById('multiplierSelection').value);
      const levelCount = parseInt(document.getElementById('levelSelection').value);
      const totalSum = parseFloat(document.getElementById('sumInput').value);
      const output = document.getElementById('output');
      const sumDisplay = document.getElementById('sum');

      output.innerHTML = '';
      sumDisplay.innerHTML = '';
      lastLevels = [];

      if (isNaN(totalSum) || totalSum <= 0) {
        output.innerHTML = "Please enter a valid total balance.";
        return;
      }

      const denominator = Math.pow(multiplier, levelCount) - 1;
      const base = totalSum * (multiplier - 1) / denominator;

      let sumCheck = 0;
      for (let i = 0; i < levelCount; i++) {
        const levelValue = base * Math.pow(multiplier, i);
        lastLevels.push({ level: i + 1, value: levelValue.toFixed(2) });
        output.innerHTML += `<p>Level ${i + 1}: ${levelValue.toFixed(2)}</p>`;
        sumCheck += levelValue;
      }

      sumDisplay.innerHTML = `Computed Total: ${sumCheck.toFixed(2)} (Target: ${totalSum.toFixed(2)})`;
    }

    function clearFields() {
      document.getElementById('sumInput').value = '';
      document.getElementById('output').innerHTML = '';
      document.getElementById('sum').innerHTML = '';
      lastLevels = [];
    }

    function toggleTheme() {
      const body = document.body;
      const toggleBtn = document.getElementById('themeToggle');
      body.classList.toggle('dark-mode');
      const mode = body.classList.contains('dark-mode') ? 'dark' : 'light';
      localStorage.setItem('theme', mode);
      toggleBtn.textContent = mode === 'dark' ? '☀️' : '🌙';
    }

    function downloadLevels() {
      if (lastLevels.length === 0) {
        alert("Please generate levels first.");
        return;
      }

      let csvContent = "Level,Value\n";
      lastLevels.forEach(lvl => {
        csvContent += `${lvl.level},${lvl.value}\n`;
      });

      const blob = new Blob([csvContent], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "levels.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    window.onload = function () {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('themeToggle').textContent = '☀️';
      }
    };
  </script>
</body>
</html>
